    const etape = s.etape || 0;
    const prog = s.programme && s.programme.length ? s.programme : ['carriere'];
    const ongletId = prog[etape];
    const onglet = DATA.ONGLETS.find(function (o) { return o.id === ongletId; });

    $feuillet.appendChild(enteteAnnee(prog.length > 1 ? 'étape ' + (etape + 1) + ' / ' + prog.length : null));

    const bloc = el('div', { class: 'bloc' });
    if (prog.length > 1) {
      const barre = el('div', { class: 'etapes-annee' });
      prog.forEach(function (id, i) {
        const o = DATA.ONGLETS.find(function (x) { return x.id === id; });
        barre.appendChild(el('span', { class: 'etape' + (i < etape ? ' faite' : i === etape ? ' courante' : '') }, el('span', { class: 'ico', text: DATA.ICONES_ONGLETS[id] }), o.label + (i < etape ? ' ✓' : '')));
      });
      bloc.appendChild(barre);
    }
    bloc.appendChild(el('h2', { class: 'titre-ecran' }, el('span', { class: 'ico', text: DATA.ICONES_ONGLETS[ongletId] }), onglet.label));
    bloc.appendChild(el('p', { class: 'sous-titre', text: genrer(onglet.intro) }));
    if (ongletId === 'carriere') bloc.appendChild(el('p', { class: 'contexte', html: contexte() }));

    const grille = el('div', { class: 'options', 'data-onglet': ongletId });
    E.actionsDisponibles(s, ongletId).forEach(function (item) {
      const a = item.action;
      const effets = E.decrireEffets(s, a.effets);
      const detail = typeof a.detail === 'function' ? a.detail(s) : a.detail;
      const label = typeof a.label === 'function' ? a.label(s) : a.label;
      const eff = effets.length ? chipsEffets(effets) : el('span', { class: 'effets' }, el('span', { class: 'neutre-txt', text: a.neutre ? 'Aucun effet notable' : 'Résultat variable' }));
      if (a.candidature) eff.appendChild(el('span', { class: 'neutre-txt', text: '· verdict en fin d\'année' }));
      grille.appendChild(el('button', { type: 'button', class: 'option' + (a.neutre ? ' neutre' : ''), disabled: item.motif ? 'disabled' : null, onclick: function () { E.choisirAction(s, a.id); apres(); } },
        el('span', { class: 'ligne-titre' }, el('span', { class: 'ico', text: DATA.ICONES_ACTIONS[a.id] || DATA.ICONES_ONGLETS[ongletId] }), el('span', { class: 'libelle', text: genrer(label) })),
        el('span', { class: 'detail', text: genrer(detail) }),
        item.motif ? el('span', { class: 'motif', text: '🔒 ' + genrer(item.motif) }) : null,
        eff
      ));
    });
    bloc.appendChild(grille);
    $feuillet.appendChild(bloc);
  }

  function contexte() {
    const depuis = s.annee - s.posteDepuis;
    const ans = function (n) { return n + ' an' + (n > 1 ? 's' : ''); };
    const phrases = {
      etudiant: 'Vous êtes ' + genrer('étudiant·e') + '. Les années passent vite ; à 24 ans, il faudra bien faire quelque chose de votre vie.',
      militant: 'Vous êtes ' + genrer('militant·e') + ' sans mandat ni emploi stable. Le parti compte sur vous pour les tracts, et sur personne pour votre loyer.',
      collaborateur: 'Vous rédigez des questions écrites et gérez l\'agenda d\'un ' + genrer('député·e') + ' qui ne retient pas votre prénom.',
      apparatchik: 'Vous connaissez le siège du parti par cœur, y compris la machine à café qui ne rend pas la monnaie.',
      fonctionnaire: 'Vous servez l\'État en notes de trois parties. Le ministre change ; vous restez.',
      prive: 'Vous gagnez bien votre vie dans le privé. La politique vous manque un peu, le samedi surtout.',
      syndicaliste: 'Vous êtes ' + genrer('délégué·e') + ' syndical' + (s.genre === 'f' ? 'e' : '') + '. Vous connaissez le code du travail et le nom de chaque ouvrier de l\'usine.',
      conseiller_municipal: 'Vous siégez au conseil municipal de ' + s.ville + '. Les séances sont longues, les enjeux sont réels : le stationnement, surtout.',
      conseiller_regional: 'Vous siégez au conseil régional de ' + s.region + '. Les lycées, les trains, et un hémicycle où personne ne vous écoute encore.',
      maire: 'Vous êtes maire de ' + s.ville + ' depuis ' + ans(depuis) + '. On vous arrête au marché pour parler des poubelles.',
      chef_cabinet: 'Vous dirigez un cabinet. Vous décidez de tout, personne ne connaît votre visage.',
      secretaire_national: 'Vous êtes ' + genrer('secrétaire national·e') + ' du parti. Vous passez à la télévision quand le porte-parole est malade.',
      think_tank: 'Vous dirigez un think tank. Vos notes circulent dans les cabinets ; votre nom, un peu moins.',
      depute: 'Vous siégez au Palais-Bourbon pour la ' + s.circo + '. Vous connaissez la buvette, les couloirs et le sens du mot « godillot ».',
      senateur: 'Vous siégez au Palais du Luxembourg. Le rythme est plus lent, les moquettes plus épaisses.',
      president_region: 'Vous présidez la région ' + s.region + ' depuis ' + ans(depuis) + '. Un budget de plusieurs milliards, et des lycéens qui ne savent pas qui vous êtes.',
      depute_europeen: 'Vous siégez au Parlement européen. Strasbourg le lundi, Bruxelles le mercredi, votre circonscription quand vous y pensez.',
      prefet: 'Vous êtes ' + genrer('préfet|préfète') + '. L\'État, c\'est vous, avec un uniforme.',
      ambassadeur: 'Vous représentez la France à l\'étranger. Les réceptions sont belles, les nouvelles de Paris arrivent avec retard.',
      ministre_delegue: 'Vous êtes ' + genrer('ministre délégué·e') + ' ' + s.portefeuille + '. Vous avez un cabinet, un chauffeur et aucune autonomie.',
      ministre: 'Vous êtes ministre ' + s.portefeuille + '. Votre nom est dans les journaux tous les jours, pas toujours dans le bon sens.',
      president_assemblee: 'Vous présidez l\'Assemblée nationale. Quatrième personnage de l\'État, et le seul à connaître le règlement.',
      secretaire_general_elysee: 'Vous êtes ' + genrer('secrétaire général·e') + ' de l\'Élysée. Le Président décide ; vous décidez de ce qu\'il décide.',
      commissaire_europeen: 'Vous êtes commissaire européen' + (s.genre === 'f' ? 'ne' : '') + ' depuis ' + ans(depuis) + '. Bruxelles vous écoute ; la France vous a oublié·e.',
      premier_ministre: 'Vous êtes à Matignon. Tout ce qui va mal est de votre faute ; tout ce qui va bien vient de l\'Élysée.',
      president: 'Vous êtes ' + genrer('Président·e') + ' de la République depuis ' + ans(depuis) + '. Le prochain scrutin est en ' + (s.posteDepuis + 5) + '.',
      ancien_president: 'Vous êtes ' + genrer('ancien·ne') + ' ' + genrer('Président·e') + ' de la République. Le monde vous invite, le pays vous a rangé·e.',
      lobbyiste: 'Vous dirigez ' + s.nom + ' & Associés. Vous facturez cher ce que vous faisiez gratuitement avant : présenter des gens à d\'autres gens.',
      conseil_constitutionnel: 'Vous siégez rue de Montpensier. Robe, discrétion et délibérés. Il vous reste ' + ans(Math.max(0, 9 - depuis)) + ' de mandat.'
    };
    return echapper(genrer(phrases[s.poste] || ''));
  }

  /* ---------------------------------------------------------------------
     Phase « événement » / « offre »
     --------------------------------------------------------------------- */
  function rendreEvenement(ev, onChoisir, offre) {
    $feuillet.appendChild(enteteAnnee(offre ? 'proposition' : 'événement'));
    const rivalEv = /^rival_/.test(ev.id);
    const gen = rivalEv ? genrerRival : genrer;
    const bloc = el('div', { class: 'bloc evenement ' + ev.type });
    bloc.appendChild(el('div', { class: 'source', text: (ev.type === 'note' ? '📝 Un mot pour vous' : ev.type === 'presse' ? '📰 ' + genrer(ev.source ? ev.source(s) : 'Presse') : '✉️ ' + genrer(ev.source ? ev.source(s) : 'Courrier')) }));
    bloc.appendChild(el('h3', { text: gen(ev.titre(s)) }));
    bloc.appendChild(el('p', { text: gen(ev.texte(s)) }));

    const grille = el('div', { class: 'options' });
    ev.choix.forEach(function (c, i) {
      const motif = c.req ? c.req(s) : null;
      grille.appendChild(el('button', { type: 'button', class: 'option', disabled: motif ? 'disabled' : null, onclick: function () { onChoisir(i); } },
        el('span', { class: 'ligne-titre' }, el('span', { class: 'libelle', text: gen(c.label) })),
        c.detail ? el('span', { class: 'detail', text: gen(c.detail) }) : null,
        motif ? el('span', { class: 'motif', text: '🔒 ' + genrer(motif) }) : null
      ));
    });
    bloc.appendChild(grille);
    $feuillet.appendChild(bloc);
  }

  /* ---------------------------------------------------------------------
     Phase « bilan »
     --------------------------------------------------------------------- */
  function carteUne(u) {
    const dates = ['3 janvier', '17 février', '9 mars', '22 avril', '6 mai', '14 juin', '2 juillet', '28 août', '11 septembre', '19 octobre', '5 novembre', '13 décembre'];
    const jour = dates[(u.titre.length + u.annee) % dates.length];
    const prix = ((u.annee - 2000) / 10 + 1.2).toFixed(2).replace('.', ',') + ' €';
    const sous = u.bon ? 'Analyse, réactions et coulisses en pages 2 et 3.' : 'Enquête, documents et réactions en pages 2 à 5.';
    return el('div', { class: 'une ' + (u.bon ? 'bon' : 'mauvais') },
      el('div', { class: 'manchette' }, el('span', { class: 'journal', text: u.journal }), el('span', { class: 'date', text: jour + ' ' + u.annee + ' · ' + prix })),
      el('div', { class: 'corps-une' },
        el('div', { class: 'illu', html: illustration(u.kind, u.bon) }),
        el('div', {}, el('h4', { text: genrer(u.titre) }), el('p', { class: 'chapo', text: sous }), el('div', { class: 'colonnes' }, el('i'), el('i'), el('i')))
      )
    );
  }

  function rendreBilan() {
    $feuillet.appendChild(enteteAnnee('bilan de l\'année'));
    const bloc = el('div', { class: 'bloc' });
    bloc.appendChild(el('h2', { class: 'titre-ecran', text: 'Bilan ' + s.annee }));

    const unes = s.unes.filter(function (u) { return u.annee === s.annee; });
    if (unes.length) {
      const grille = el('div', { class: 'unes' });
      unes.forEach(function (u) { grille.appendChild(carteUne(u)); });
      bloc.appendChild(grille);
    }

    const tampons = el('div', { class: 'tampons' });
    const ul = el('ul', { class: 'bilan' });
    s.journal.forEach(function (l) {
      const h = versHtml(l.texte);
      h.tampons.forEach(function (t) { tampons.appendChild(tampon(t.texte, t.cls)); });
      if (h.html) ul.appendChild(el('li', { class: l.classe, html: h.html }));
    });
    if (tampons.children.length) bloc.appendChild(tampons);
    bloc.appendChild(ul);

    const noteNow = E.note(s), delta = noteNow - (s.notePrec || noteNow);
    bloc.appendChild(el('div', { class: 'actions-bas' },
      el('button', { class: 'bouton grand', text: 'Année suivante →', onclick: function () { E.anneeSuivante(s); apres(); } }),
      el('span', { class: 'badge ' + (delta > 0 ? 'vert' : delta < 0 ? 'rouge' : ''), text: 'Note ' + noteNow + (delta ? (delta > 0 ? ' (+' : ' (') + delta + ')' : '') })
    ));
    $feuillet.appendChild(bloc);
  }

  /* ---------------------------------------------------------------------
     Clôture
     --------------------------------------------------------------------- */
  function rendreFin() {
    const f = s.fin;
    const noteFin = E.note(s);
    const bloc = el('div', { class: 'bloc cloture' });
    bloc.appendChild(el('div', { class: 'tampons', style: 'justify-content:center' },
      tampon(f.raison === 'condamnation' ? 'Carrière terminée' : 'Carrière terminée', f.raison === 'condamnation' ? 'rouge' : 'bleu', 'grand'),
      tampon(f.objectif.atteint ? 'Objectif atteint' : 'Objectif manqué', f.objectif.atteint ? 'vert' : 'rouge')
    ));
    bloc.appendChild(el('div', { class: 'grande-note' }, String(noteFin), el('small', { text: 'note de carrière sur 100 · ' + qualificatifNote(noteFin) })));
    bloc.appendChild(el('div', { class: 'titre-fin', text: f.titre }));
    bloc.appendChild(el('p', { class: 'epitaphe', text: genrer(f.epitaphe) }));
    bloc.appendChild(el('div', { class: 'grille-score' },
      el('div', {}, 'Années', el('b', { text: String(s.age - 18) })),
      el('div', {}, 'Sommet', el('b', { text: genrer(DATA.POSTES[s.pic.poste].label), style: 'font-size:14px;line-height:1.2' })),
      el('div', {}, 'Fortune', el('b', { text: formatK(s.fortune) })),
      el('div', {}, 'Postérité', el('b', { text: String(f.score) })),
      el('div', {}, 'Scandales', el('b', { text: String(s.scandales) })),
      el('div', {}, 'Objectif', el('b', { text: f.objectif.label, style: 'font-size:13px;line-height:1.2' }))
    ));

    if (s.unes.length) {
      bloc.appendChild(el('h2', { class: 'titre-ecran', style: 'margin-top:18px;text-align:left', text: '📰 Revue de presse' }));
      const grille = el('div', { class: 'unes', style: 'text-align:left' });
      s.unes.slice(-8).reverse().forEach(function (u) { grille.appendChild(carteUne(u)); });
      bloc.appendChild(grille);
    }
    if (s.decorations.length) {
      bloc.appendChild(el('h2', { class: 'titre-ecran', style: 'margin-top:18px;text-align:left', text: '🏅 Palmarès' }));
      bloc.appendChild(grilleDecorations(s.decorations, false));
    }

    bloc.appendChild(el('div', { class: 'actions-bas', style: 'justify-content:center' },
      el('button', { class: 'bouton grand', text: 'Nouvelle carrière', onclick: function () { s = null; try { localStorage.removeItem(CLE_SAVE); } catch (e) {} rendre(); } }),
      el('button', { class: 'bouton clair', text: 'Copier le bilan', onclick: function (ev) {
        const txt = 'LA CONQUÊTE — ' + s.prenom + ' ' + s.nom + ' (' + genrer(DATA.ORIGINES[s.origine].label) + ', ' + genrer(DATA.PERSONNALITES[s.personnalite].label).toLowerCase() + ', ' + genrer(DATA.IDEOLOGIES[s.ideologie].label).toLowerCase() + ')\nNote : ' + noteFin + '/100 · ' + f.titre + '\nObjectif « ' + f.objectif.label + ' » : ' + (f.objectif.atteint ? 'atteint' : 'manqué') + '\nSommet : ' + genrer(DATA.POSTES[s.pic.poste].label) + ' · ' + (s.age - 18) + ' ans de carrière · ' + formatK(s.fortune) + '\n' + genrer(f.epitaphe);
        if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { ev.target.textContent = 'Copié !'; });
      } }),
      el('button', { class: 'bouton clair', text: 'Voir le parcours', onclick: function () { onglet = 'chrono'; rendre(); } })
    ));
    $feuillet.appendChild(bloc);
  }

  /* ---------------------------------------------------------------------
     Parcours (chronologie)
     --------------------------------------------------------------------- */
  function rendreChrono() {
    const bloc = el('div', { class: 'bloc' });
    if (!s) { bloc.appendChild(el('p', { text: 'Aucune carrière en cours.' })); $feuillet.appendChild(bloc); return; }
    bloc.appendChild(el('h2', { class: 'titre-ecran', text: '📅 Parcours' }));
    bloc.appendChild(el('p', { class: 'sous-titre', text: 'La carrière année par année.' }));
    const table = el('table', { class: 'registre' }, el('thead', {}, el('tr', {}, el('th', { text: 'Année' }), el('th', { text: 'Âge' }), el('th', { text: 'Fait marquant' }))));
    const tbody = el('tbody');
    s.historique.forEach(function (h) {
      tbody.appendChild(el('tr', { class: h.classe }, el('td', { class: 'annee', text: String(h.annee) }), el('td', { class: 'age', text: h.age + ' ans' }), el('td', { text: genrer(h.texte) })));
    });
    table.appendChild(tbody);
    bloc.appendChild(el('div', { style: 'overflow-x:auto' }, table));
    bloc.appendChild(el('div', { class: 'actions-bas' }, el('button', { class: 'bouton clair', text: '← Retour au jeu', onclick: function () { onglet = 'feuillet'; rendre(); } })));
    $feuillet.appendChild(bloc);
  }

  /* ---------------------------------------------------------------------
     Panthéon
     --------------------------------------------------------------------- */
  function grilleDecorations(obtenues, montrerVerrouillees) {
    const grille = el('div', { class: 'medailles' });
    Object.keys(DATA.DECORATIONS).forEach(function (k) {
      const d = DATA.DECORATIONS[k];
      const ok = obtenues.indexOf(k) !== -1;
      if (!ok && !montrerVerrouillees) return;
      grille.appendChild(el('div', { class: 'medaille' + (ok ? '' : ' verrou') }, el('div', { class: 'rond', text: '🏅' }), el('b', { text: d.nom }), el('span', { text: d.desc })));
    });
    return grille;
  }

  function rendrePantheon() {
    const pantheon = lire(CLE_PANTHEON, []);
    const decos = lire(CLE_DECOS, []);
    const bloc = el('div', { class: 'bloc' });
    bloc.appendChild(el('h2', { class: 'titre-ecran', text: '🏛️ Panthéon' }));
    bloc.appendChild(el('p', { class: 'sous-titre', text: pantheon.length ? pantheon.length + ' carrière' + (pantheon.length > 1 ? 's' : '') + ' archivée' + (pantheon.length > 1 ? 's' : '') + ', classées par note.' : 'Aucune carrière achevée pour l\'instant. Le Panthéon attend ses grands hommes et ses grandes femmes, ou au moins quelqu\'un.' }));
    const liste = el('div', { class: 'pantheon-liste' });
    pantheon.forEach(function (p, i) {
      liste.appendChild(el('div', { class: 'pantheon-ligne' },
        el('span', { class: 'rang', text: String(i + 1) }),
        el('span', {}, el('b', { text: p.nom }), ' · ' + p.pic + ' · ' + p.debut + '–' + p.fin, el('span', { class: 'titre-fin', text: p.titre + (p.profil ? ' — ' + p.profil : '') + (p.objectif ? ' — objectif ' + (p.atteint ? 'atteint' : 'manqué') : '') })),
        el('span', { class: 'score', text: String(p.note !== undefined ? p.note : p.score) })
      ));
    });
    bloc.appendChild(liste);
    bloc.appendChild(el('h2', { class: 'titre-ecran', style: 'margin-top:22px', text: '🏅 Décorations · ' + decos.length + ' / ' + Object.keys(DATA.DECORATIONS).length }));
    bloc.appendChild(grilleDecorations(decos, true));
    bloc.appendChild(el('div', { class: 'actions-bas' }, el('button', { class: 'bouton clair', text: '← Retour au jeu', onclick: function () { onglet = 'feuillet'; rendre(); } })));
    $feuillet.appendChild(bloc);
  }

  /* ---------------------------------------------------------------------
     Démarrage
     --------------------------------------------------------------------- */
  $onglets.addEventListener('click', function (ev) {
    const b = ev.target.closest('button');
    if (!b) return;
    onglet = b.dataset.tab;
    rendre();
  });

  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!confirm('Recommencer une carrière ? La carrière en cours sera perdue ; le Panthéon et les décorations sont conservés.')) return;
    s = null;
    try { localStorage.removeItem(CLE_SAVE); } catch (e) {}
    onglet = 'feuillet';
    rendre();
  });

  const sauvegarde = lire(CLE_SAVE, null);
  if (sauvegarde && sauvegarde.version === VERSION && sauvegarde.phase !== 'fin') s = sauvegarde;
  rendre();
})();

</script>
</body>
</html>
