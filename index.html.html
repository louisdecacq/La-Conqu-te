<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Conquête — Simulateur de carrière politique</title>
<meta name="description" content="De 18 ans à l'Élysée : simulez une carrière politique française, année après année.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   LA CONQUÊTE — feuille de style
   Fond uni et vif, cartes blanches arrondies, Poppins, couleurs par jauge.
   ========================================================================== */

:root {
  --fond: #1e46d3;
  --fond-2: #1738a8;
  --blanc: #ffffff;
  --creme: #f6f7fb;
  --encre: #151b33;
  --encre-douce: #4f5872;
  --encre-pale: #8d94ab;
  --ligne: #e6e8f0;

  --c-image: #ff8a3d;
  --c-reseau: #7b5cff;
  --c-competence: #2f80ed;
  --c-integrite: #22a06b;
  --c-parti: #e63946;
  --c-medias: #e85d9a;
  --c-fortune: #e9a800;

  --c-carriere: #2f80ed;
  --c-reseau-o: #7b5cff;
  --c-medias-o: #e85d9a;
  --c-prive-o: #22a06b;

  --rouge: #e63946;
  --vert: #22a06b;
  --or: #f4b400;

  --rayon: 18px;
  --ombre: 0 8px 24px rgba(10, 20, 60, 0.18);
  --police: "Poppins", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--police);
  font-size: 15px;
  line-height: 1.5;
  color: var(--encre);
  background: var(--fond);
  background-image: radial-gradient(ellipse at 15% 0%, rgba(255,255,255,0.10), transparent 55%);
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

/* --------------------------------------------------------------------------
   Barre du haut
   -------------------------------------------------------------------------- */
.entete-haut {
  max-width: 1120px;
  margin: 0 auto;
  padding: 22px 18px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.marque { display: flex; flex-direction: column; color: var(--blanc); }
.logo { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.logo em { font-style: normal; color: #ffd166; }
.sous { font-size: 12px; opacity: 0.8; font-weight: 500; margin-top: 4px; }

.nav { display: flex; gap: 6px; background: rgba(255,255,255,0.14); padding: 5px; border-radius: 999px; }
.nav button {
  border: none;
  background: transparent;
  color: var(--blanc);
  font-weight: 600;
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  opacity: 0.85;
}
.nav button:hover { opacity: 1; }
.nav button.actif { background: var(--blanc); color: var(--encre); opacity: 1; }

/* --------------------------------------------------------------------------
   Scène : fiche à gauche, jeu à droite
   -------------------------------------------------------------------------- */
.scene {
  max-width: 1120px;
  margin: 0 auto;
  padding: 10px 18px 40px;
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 18px;
  align-items: start;
}
.scene.sans-fiche { grid-template-columns: 1fr; }
.scene.sans-fiche .colonne-fiche { display: none; }

.bloc {
  background: var(--blanc);
  border-radius: var(--rayon);
  box-shadow: var(--ombre);
  padding: 18px 20px;
}
.bloc + .bloc { margin-top: 14px; }
.colonne-jeu > * + * { margin-top: 14px; }

/* --------------------------------------------------------------------------
   Fiche
   -------------------------------------------------------------------------- */
.fiche-tete { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
.avatar { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 12px rgba(10,20,60,0.15); }
.avatar svg { width: 100%; height: 100%; display: block; }
.fiche-nom { font-weight: 700; font-size: 17px; line-height: 1.15; }
.fiche-sous { font-size: 12px; color: var(--encre-douce); }

.note-bloc { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--ligne); }
.note-carre { width: 92px; height: 92px; border-radius: 20px; display: grid; place-items: center; color: var(--blanc); font-weight: 800; font-size: 40px; line-height: 1; box-shadow: 0 6px 16px rgba(10,20,60,0.2); }
.note-texte { font-size: 12.5px; color: var(--encre-douce); }
.note-texte b { display: block; font-size: 14px; color: var(--encre); }
.note-texte .delta { font-weight: 700; }
.delta.pos { color: var(--vert); } .delta.neg { color: var(--rouge); }

.poste-carte {
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--creme);
  font-size: 12.5px;
}
.poste-carte .etiquette { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--encre-pale); }
.poste-carte .valeur { font-weight: 700; font-size: 14px; }

.jauges { margin-top: 14px; display: grid; gap: 8px; }
.jauge .ligne { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; align-items: baseline; }
.jauge .ligne .val { font-weight: 800; }
.jauge .barre { height: 8px; border-radius: 999px; background: var(--ligne); overflow: hidden; margin-top: 3px; }
.jauge .barre i { display: block; height: 100%; border-radius: 999px; transition: width 0.5s ease; }
.jauge .annot { font-size: 11px; font-weight: 700; margin-left: 6px; }

.j-image { color: var(--c-image); } .j-image i { background: var(--c-image); }
.j-reseau { color: var(--c-reseau); } .j-reseau i { background: var(--c-reseau); }
.j-competence { color: var(--c-competence); } .j-competence i { background: var(--c-competence); }
.j-integrite { color: var(--c-integrite); } .j-integrite i { background: var(--c-integrite); }
.j-parti { color: var(--c-parti); } .j-parti i { background: var(--c-parti); }
.j-medias { color: var(--c-medias); } .j-medias i { background: var(--c-medias); }
.j-fortune { color: var(--c-fortune); }

.fortune-ligne { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--ligne); font-weight: 600; font-size: 13px; }
.fortune-ligne b { font-weight: 800; }
.fortune-ligne b.dette { color: var(--rouge); }

.profil { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--ligne); font-size: 12px; }
.profil .etiquette, .rival .etiquette, .climat .etiquette { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--encre-pale); margin-bottom: 4px; display: block; }
.ligne-profil { display: flex; justify-content: space-between; gap: 8px; line-height: 1.7; color: var(--encre-douce); }
.ligne-profil b { color: var(--encre); font-weight: 600; text-align: right; }
.ligne-profil.secret b { color: var(--c-reseau); }
.ligne-profil.atteint b { color: var(--vert); }

.rival, .climat { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--ligne); font-size: 12px; color: var(--encre-douce); }
.piste { height: 8px; border-radius: 999px; background: var(--ligne); position: relative; margin: 6px 0; overflow: hidden; }
.piste i { position: absolute; top: 0; bottom: 0; width: 10px; border-radius: 999px; transform: translateX(-50%); }
.camp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.camp.gauche { background: #e63946; } .camp.centre { background: #f4b400; } .camp.droite { background: #2f80ed; } .camp.populiste { background: #6d4c41; }

/* --------------------------------------------------------------------------
   En-tête d'écran, rubriques, points de progression
   -------------------------------------------------------------------------- */
.entete-ecran { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.entete-ecran .annee { font-weight: 800; font-size: 28px; line-height: 1; }
.entete-ecran .annee small { font-size: 13px; font-weight: 600; color: var(--encre-douce); margin-left: 8px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--creme); color: var(--encre-douce); }
.badge.bleu { background: #e6efff; color: var(--c-competence); }
.badge.rouge { background: #fde8eb; color: var(--rouge); }
.badge.vert { background: #e2f6ec; color: var(--vert); }
.badge.or { background: #fff3cc; color: #9a6b00; }
.badge.violet { background: #efeaff; color: var(--c-reseau); }

h2.titre-ecran { margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
h2.titre-ecran .ico { margin-right: 8px; }
.sous-titre { margin: 0 0 14px; color: var(--encre-douce); font-size: 14px; }
.contexte { margin: 0 0 12px; font-size: 14px; color: var(--encre-douce); }

.points { display: flex; gap: 6px; justify-content: center; margin: 0 0 14px; }
.points i { width: 20px; height: 6px; background: var(--ligne); border-radius: 3px; }
.points i.fait { background: var(--vert); }
.points i.courant { background: var(--rouge); width: 34px; }

.etapes-annee { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.etape { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--creme); font-weight: 600; font-size: 13px; color: var(--encre-pale); }
.etape .ico { font-size: 16px; }
.etape.courante { background: var(--encre); color: var(--blanc); }
.etape.faite { color: var(--vert); }

/* --------------------------------------------------------------------------
   Cartes de choix
   -------------------------------------------------------------------------- */
.options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.option {
  text-align: left;
  background: var(--blanc);
  border: 2px solid #cfd5e6;
  border-radius: 16px;
  padding: 14px 16px 12px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(10, 20, 60, 0.08);
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  color: var(--encre);
}
.option:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(10, 20, 60, 0.16); border-color: var(--c-carriere); }
.options[data-onglet="reseau"] .option:hover:not(:disabled) { border-color: var(--c-reseau-o); }
.options[data-onglet="medias"] .option:hover:not(:disabled) { border-color: var(--c-medias-o); }
.options[data-onglet="prive"] .option:hover:not(:disabled) { border-color: var(--c-prive-o); }
.option:disabled { cursor: not-allowed; opacity: 0.6; background: var(--creme); }
.option .ligne-titre { display: flex; align-items: center; gap: 10px; }
.option .ico { font-size: 22px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--creme); flex: none; }
.option .libelle { font-weight: 700; font-size: 15px; line-height: 1.2; }
.option .detail { font-size: 13px; color: var(--encre-douce); line-height: 1.4; }
.option .motif { font-size: 12px; color: var(--rouge); font-weight: 600; }
.option .effets { display: flex; gap: 6px 10px; flex-wrap: wrap; font-size: 12px; font-weight: 700; margin-top: auto; padding-top: 6px; }
.option .effets span { white-space: nowrap; }
.option .effets .neutre-txt { color: var(--encre-pale); font-weight: 500; }
.option.neutre { border-style: dashed; border-color: var(--ligne); }

.grille-choix { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.grille-choix.grille-serree { grid-template-columns: repeat(3, 1fr); }
.grille-choix.grille-pilules { grid-template-columns: repeat(4, 1fr); }
.carte {
  text-align: left;
  background: var(--blanc);
  border: 2px solid var(--ligne);
  border-radius: 16px;
  padding: 14px 16px;
  cursor: pointer;
  color: var(--encre);
  transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.carte:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(10, 20, 60, 0.14); border-color: var(--c-competence); }
.carte.choisie { border-color: var(--c-reseau); box-shadow: 0 0 0 3px rgba(123, 92, 255, 0.18); }
.carte h4 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
.carte p { margin: 0 0 6px; font-size: 13px; color: var(--encre-douce); line-height: 1.4; }
.carte .apercu { font-size: 12px; font-weight: 600; line-height: 1.6; }
.carte .apercu .plus { color: var(--vert); } .carte .apercu .moins { color: var(--rouge); }
.carte .apercu .stat { margin-right: 8px; }
.grille-pilules .carte { padding: 10px 12px; } .grille-pilules .carte h4 { margin: 0; font-size: 14px; }

/* --------------------------------------------------------------------------
   Formulaire d'identité, boutons
   -------------------------------------------------------------------------- */
.champ label, .champ .legende { display: block; font-size: 12px; font-weight: 600; color: var(--encre-douce); margin-bottom: 6px; }
.champ input[type="text"] {
  width: 100%; font-family: inherit; font-size: 16px; font-weight: 600;
  padding: 10px 14px; border: 2px solid var(--ligne); border-radius: 12px; background: var(--creme); color: var(--encre); outline: none;
}
.champ input[type="text"]:focus { border-color: var(--c-competence); background: var(--blanc); }
.cases-radio { display: flex; gap: 10px; flex-wrap: wrap; }
.cases-radio label { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border: 2px solid var(--ligne); border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.cases-radio input { display: none; }
.cases-radio .case { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--encre-pale); }
.cases-radio input:checked + .case { background: var(--c-reseau); border-color: var(--c-reseau); }
.cases-radio label:has(input:checked) { border-color: var(--c-reseau); background: #f4f1ff; }

.bouton {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 14px;
  background: var(--encre); color: var(--blanc);
  border: none; border-radius: 999px; padding: 12px 22px; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  box-shadow: 0 6px 16px rgba(10, 20, 60, 0.18);
}
.bouton:hover { transform: translateY(-2px); }
.bouton.clair { background: var(--blanc); color: var(--encre); border: 2px solid var(--ligne); box-shadow: none; }
.bouton.rouge { background: var(--rouge); }
.bouton.vert { background: var(--vert); }
.bouton.grand { font-size: 16px; padding: 14px 28px; }
.lien { background: none; border: none; padding: 0; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }
.actions-bas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.nav-creation { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.reprise { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }

/* --------------------------------------------------------------------------
   Événement, unes de journaux, bilan
   -------------------------------------------------------------------------- */
.evenement .source { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--encre-pale); margin-bottom: 6px; }
.evenement h3 { margin: 0 0 8px; font-size: 22px; font-weight: 800; line-height: 1.15; }
.evenement p { margin: 0 0 14px; font-size: 15px; color: var(--encre-douce); }
.evenement.note { background: #fff8d6; }
.evenement.note h3 { color: #6b4e00; }
.evenement.presse { border-left: 6px solid var(--c-medias); }
.evenement.courrier { border-left: 6px solid var(--c-competence); }

.unes { display: grid; gap: 10px; margin: 0 0 14px; }
.une {
  background: #fbf8f1;
  border: 1px solid #d9d3c3;
  border-radius: 6px;
  padding: 12px 14px 10px;
  box-shadow: 0 3px 0 #d9d3c3, 0 6px 14px rgba(10,20,60,0.12);
  font-family: Georgia, "Times New Roman", serif;
  color: #1b1b1b;
}
.une .manchette { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px double #1b1b1b; padding-bottom: 4px; margin-bottom: 8px; gap: 10px; }
.une .journal { font-weight: 800; font-size: 20px; letter-spacing: 0.02em; text-transform: uppercase; }
.une .date { font-size: 10.5px; color: #5a5a5a; font-family: var(--police); white-space: nowrap; }
.une .corps-une { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: start; }
.une .illu { width: 120px; height: 90px; border: 1px solid #c9c3b3; overflow: hidden; background: #eee; filter: saturate(0.85); }
.une .illu svg { width: 100%; height: 100%; display: block; }
.une h4 { margin: 0 0 4px; font-size: 19px; line-height: 1.15; font-weight: 800; }
.une .chapo { margin: 0 0 6px; font-size: 12px; font-style: italic; color: #444; }
.une .colonnes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.une .colonnes i { display: block; height: 22px; background: repeating-linear-gradient(180deg, #c9c3b3 0 2px, transparent 2px 5px); opacity: 0.8; }
.une.mauvais h4 { color: #8c1d29; }

.bilan { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.bilan li { padding: 8px 12px; border-radius: 10px; background: var(--creme); font-size: 13.5px; color: var(--encre-douce); }
.bilan li.bon { background: #e2f6ec; color: #135c3d; }
.bilan li.mauvais { background: #fde8eb; color: #8c1d29; }
.bilan li.majeur { font-weight: 600; color: var(--encre); }
.tampons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.tampon { font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--rouge); color: var(--blanc); letter-spacing: 0.03em; }
.tampon.bleu { background: var(--c-competence); } .tampon.vert { background: var(--vert); } .tampon.grand { font-size: 18px; padding: 10px 20px; }

/* --------------------------------------------------------------------------
   Fin, chronologie, panthéon
   -------------------------------------------------------------------------- */
.cloture { text-align: center; }
.cloture .grande-note { font-size: 72px; font-weight: 800; line-height: 1; margin: 6px 0 0; }
.cloture .grande-note small { display: block; font-size: 12px; font-weight: 600; color: var(--encre-pale); letter-spacing: 0.08em; text-transform: uppercase; }
.cloture .titre-fin { font-size: 30px; font-weight: 800; margin: 12px 0 4px; }
.cloture .epitaphe { color: var(--encre-douce); max-width: 560px; margin: 0 auto 14px; }
.grille-score { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 14px 0; }
.grille-score div { background: var(--creme); border-radius: 12px; padding: 10px; font-size: 11.5px; font-weight: 600; color: var(--encre-douce); }
.grille-score b { display: block; font-size: 20px; color: var(--encre); font-weight: 800; }

.registre { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.registre th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--encre-pale); padding: 6px 8px; border-bottom: 2px solid var(--ligne); }
.registre td { padding: 7px 8px; border-bottom: 1px solid var(--ligne); vertical-align: top; }
.registre td.annee { white-space: nowrap; font-weight: 700; width: 5em; }
.registre td.age { white-space: nowrap; color: var(--encre-pale); width: 4.5em; }
.registre tr.majeur td { font-weight: 600; }
.registre tr.mauvais td:last-child { color: var(--rouge); }
.registre tr.bon td:last-child { color: var(--vert); }

.medailles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 20px; }
.medaille { background: var(--creme); border-radius: 14px; padding: 12px; text-align: center; font-size: 12px; color: var(--encre-douce); }
.medaille.verrou { opacity: 0.45; filter: grayscale(1); }
.medaille .rond { width: 44px; height: 44px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: linear-gradient(135deg, #ffe08a, #f4b400); }
.medaille b { display: block; color: var(--encre); font-size: 13px; margin-bottom: 2px; }

.pantheon-liste { display: grid; gap: 8px; }
.pantheon-ligne { display: grid; grid-template-columns: 2.4em 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--creme); border-radius: 12px; font-size: 13.5px; }
.pantheon-ligne .rang { font-weight: 800; font-size: 20px; color: var(--c-reseau); }
.pantheon-ligne .titre-fin { display: block; color: var(--encre-douce); font-size: 12.5px; }
.pantheon-ligne .score { font-weight: 800; font-size: 20px; }

.pied {
  max-width: 1120px; margin: 0 auto; padding: 0 18px 30px;
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  color: rgba(255,255,255,0.7); font-size: 12px;
}
.pied .lien { color: var(--blanc); }

/* --------------------------------------------------------------------------
   Petit écran
   -------------------------------------------------------------------------- */
@media (max-width: 760px) {
  .scene { grid-template-columns: 1fr; }
  .options, .grille-choix, .grille-choix.grille-serree { grid-template-columns: 1fr; }

.piste-mini i { display: block; height: 100%; border-radius: 999px; background: currentColor; }
.effets-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 12px; font-weight: 600; line-height: 1.35; }
.effets-liste li { padding-left: 18px; position: relative; }
.effets-liste li::before { position: absolute; left: 0; top: 0; font-weight: 800; }
.effets-liste li.plus { color: var(--vert); } .effets-liste li.plus::before { content: "+"; }
.effets-liste li.moins { color: var(--rouge); } .effets-liste li.moins::before { content: "−"; }

@media (max-width: 760px) { .origine-detail { grid-template-columns: 1fr; } }

  };
  DATA.ACTIONS.forEach(function (a) {
    if (!a.onglet) {
      a.onglet = 'carriere';
      Object.keys(affectations).forEach(function (o) { if (affectations[o].indexOf(a.id) !== -1) a.onglet = o; });

})();

    const st = s.stats;
    const jauges = (st.image + st.reseau + st.competence + st.parti + st.medias) / 500;
    const carriere = 0.5 * (s.pic.tier / 6) + 0.5 * Math.min(1, s.posterite / 500);
    const fortune = Math.min(1, Math.max(0, s.fortune) / 2000);
    const deco = Math.min(1, s.decorations.length / 12);
    const objectif = objectifAtteint(s) ? 1 : 0;
    let raw = 0.30 * carriere + 0.30 * jauges + 0.10 * (st.integrite / 100) + 0.10 * fortune + 0.10 * deco + 0.10 * objectif;
    raw -= s.scandales * 0.02;
    if (s.flags.condamne) raw -= 0.25;
    return clamp(Math.round(42 + 66 * raw), 0, 98);
  }

  /* ---------------------------------------------------------------------
     Unes de journaux pour les grands moments
     --------------------------------------------------------------------- */
  function une(s, kind, vars) {
    vars = vars || {};
    const gabarits = DATA.UNES[kind] || DATA.UNES.scandale;
    let titre = pick(gabarits)
      .replace(/\{nom\}/g, s.prenom + ' ' + s.nom)
      .replace(/\{lieu\}/g, vars.lieu || s.ville)
      .replace(/\{poste\}/g, vars.poste || G(s, DATA.POSTES[s.poste].label))
      .replace(/\{camp\}/g, vars.camp || DATA.CAMPS[s.camp].label)
      .replace(/\{parti\}/g, s.partiNom || DATA.CAMPS[s.camp].parti);
    s.unes.push({ annee: s.annee, kind: kind, journal: pick(DATA.JOURNAUX), titre: titre, bon: vars.bon !== undefined ? vars.bon : !/perdue|scandale|secret|condamnation|chute|perdu_mandat/.test(kind) });
    if (s.unes.length > 60) s.unes.shift();
  }

  /* ---------------------------------------------------------------------
     Programme de l'année : quelles rubriques reviennent cette année ?
     Carrière quand il y a quelque chose à décider (élection, transition,
     mandat en jeu) ou tous les deux ans ; une rubrique légère au plus,
     jamais deux années de suite la même.
     --------------------------------------------------------------------- */
  function planifierAnnee(s) {
    const prog = [];
    const d = s.dernier || {};
    if (s.poste === 'president') { s.programme = ['carriere', 'medias']; s.etape = 0; return; }
    const carriere = actionsDisponibles(s, 'carriere');
    const decisif = carriere.some(function (x) { return !x.motif && (x.action.candidature || x.action.transition || /viser_|think_tank|fonder_cabinet|cc_droit|retour|marche_travail|doctorat|insp|sciencespo|droit|socio|technique|commission_ue|fonder_parti|fonder_courant/.test(x.action.id)); });
    if (decisif || mandatEnJeu(s) || s.annee - (d.carriere || 2024) >= 2 || s.posteDepuis === s.annee) prog.push('carriere');

    const legers = ['reseau', 'medias', 'prive'].filter(function (o) { return s.annee - (d[o] || 2020) >= 2; });
    if (legers.length && (prog.length === 0 || hasard() < 0.55)) {
      // privilégie la rubrique la plus ancienne, avec un peu de hasard
      legers.sort(function (a, b) { return (d[a] || 2020) - (d[b] || 2020); });
      prog.push(hasard() < 0.6 ? legers[0] : pick(legers));
    }
    if (!prog.length) prog.push('carriere');
    s.programme = prog;
    s.etape = 0;
  }

  /* ---------------------------------------------------------------------
     Jauges
     --------------------------------------------------------------------- */
  function facteurGain(s, k, v) {
    if (v <= 0) return v;
    if (k === 'image') {
      if (s.communication === 'orateur') v *= 1.25;
      if (s.communication === 'intellectuel') v *= 0.8;
      if (s.personnalite === 'pragmatiste') v *= 0.85;
      if (s.personnalite === 'baron_noir') v *= 0.85;
    }
    if (k === 'competence' && s.communication === 'intellectuel') v *= 1.2;
    if (k === 'parti' && s.personnalite === 'courtisan') v *= 1.15;
    return v;
  }

  function appliquer(s, effets) {
    if (!effets) return;
    if (typeof effets === 'function') effets = effets(s);
    Object.keys(effets).forEach(function (k) {
      let v = effets[k];
      if (!v) return;
      if (k === 'fortune') {
        s.fortune = Math.round(s.fortune + v);
        s.deltas.fortune = (s.deltas.fortune || 0) + v;
      } else if (k === 'casseroles') {
        s.casseroles = Math.max(0, s.casseroles + v);
      } else if (k === 'proximite') {
        const av = s.proximite === undefined ? 50 : s.proximite;
        s.proximite = clamp(Math.round(av + v), 0, 100);
        s.deltas.proximite = (s.deltas.proximite || 0) + (s.proximite - av);
      } else if (JAUGES.indexOf(k) !== -1) {
        const avant = s.stats[k];
        if (k === 'integrite' && v < 0) {
          if (s.personnalite === 'pragmatiste') v = Math.round(v * 0.7);
          if (s.personnalite === 'idealiste') { s.stats.image = clamp(s.stats.image - 2, 0, 100); s.deltas.image = (s.deltas.image || 0) - 2; }
        }
        v = facteurGain(s, k, v);
        if (v > 0) v = Math.max(1, Math.round(v * (1 - avant / 160)));   // rendements décroissants
        s.stats[k] = clamp(Math.round(avant + v), 0, 100);
        s.deltas[k] = (s.deltas[k] || 0) + (s.stats[k] - avant);
      }
    });
  }

  function coupImage(s, n) {
    let f = 1;
    if (s.origine === 'ministre') f *= 1.3;
    if (s.communication === 'mediatique') f *= 1.2;
    return Math.round(n * f);
  }

  function decorer(s, id) {
    if (!DATA.DECORATIONS[id] || s.decorations.indexOf(id) !== -1) return;
    s.decorations.push(id);
    log(s, 'Décoration obtenue : ' + DATA.DECORATIONS[id].nom, 'bon', true);
  }

  function exposerSecret(s) {
    s.flags.secret_expose = true;
    if (s.personnalite === 'ambitieux') s.rival.force = clamp(s.rival.force + 10, 0, 100);
  }

  /* ---------------------------------------------------------------------
     Postes
     --------------------------------------------------------------------- */
  function changerPoste(s, poste) {
    const avant = s.poste;
    if (avant === poste) return;
    const Q = DATA.POSTES[poste];
    s.poste = poste;
    s.posteDepuis = s.annee;
    if (Q.tier > s.pic.tier) s.pic = { tier: Q.tier, poste: poste };

    if (poste === 'depute' || poste === 'senateur') s.flags.siege = poste;
    else if (GOUV_POSTES.indexOf(poste) === -1) s.flags.siege = null;
    if (GOUV_POSTES.indexOf(poste) !== -1 || poste === 'president') s.flags.ex_ministre = true;
    if (GOUV_POSTES.indexOf(poste) === -1) s.portefeuille = null;

    if (['conseiller_municipal', 'conseiller_regional', 'maire', 'president_region', 'depute', 'senateur', 'depute_europeen'].indexOf(poste) !== -1) decorer(s, 'premier_mandat');
    if (poste === 'maire') decorer(s, 'echarpe');
    if (poste === 'president_region') decorer(s, 'hotel_region');
    if (poste === 'depute') decorer(s, 'palais_bourbon');
    if (poste === 'senateur') decorer(s, 'luxembourg');
    if (poste === 'depute_europeen') decorer(s, 'strasbourg');
    if (poste === 'president_assemblee') decorer(s, 'perchoir');
    if (poste === 'secretaire_general_elysee') decorer(s, 'ombre');
    if (poste === 'commissaire_europeen') decorer(s, 'berlaymont');
    if (poste === 'conseil_constitutionnel') decorer(s, 'montpensier');
    if (GOUV_POSTES.indexOf(poste) !== -1) { decorer(s, 'maroquin'); if (s.origine === 'ministre') decorer(s, 'dynastie'); }
    if (poste === 'premier_ministre') decorer(s, 'matignon');
    if (poste === 'president') { decorer(s, 'elysee'); if (s.origine === 'ouvrier') decorer(s, 'legende'); }
    if (Q.tier >= 3 && s.origine === 'agriculteur' && poste !== 'lobbyiste') decorer(s, 'fils_terre');
    if (['ministre_delegue', 'ministre', 'premier_ministre', 'president_assemblee', 'secretaire_general_elysee', 'commissaire_europeen', 'conseil_constitutionnel', 'prefet', 'ambassadeur'].indexOf(poste) !== -1) {
      une(s, 'nomination', { poste: G(s, Q.label) + (s.portefeuille ? ' ' + s.portefeuille : '') });
    }

    log(s, 'Nouveau poste : ' + G(s, Q.label) + (s.portefeuille ? ' ' + s.portefeuille : ''), 'majeur', true);
  }

  function nommer(s, poste) {
    if (poste === 'premier_ministre') s.portefeuille = null;
    else {
      const expert = DATA.EXPERTISES[s.expertise].portefeuille;
      s.portefeuille = hasard() < 0.4 ? expert : pick(DATA.PORTEFEUILLES);
    }
    changerPoste(s, poste);
    if (s.portefeuille && s.portefeuille === DATA.EXPERTISES[s.expertise].portefeuille) {
      appliquer(s, { competence: 4, image: 2 });
      log(s, 'Le portefeuille correspond à votre expertise : les dossiers vous obéissent.', 'bon');
    }
  }

  /** Où retombe-t-on quand on perd un ministère ? */
  function retourSiege(s) {
    if (s.flags.siege === 'depute') return 'depute';
    if (s.flags.siege === 'senateur') return 'senateur';
    if (s.stats.parti >= 50) return 'secretaire_national';
    return 'militant';
  }

  function demission(s) {
    const p = s.poste;
    if (p === 'president') changerPoste(s, 'ancien_president');
    else if (estGouv(s) || p === 'president_assemblee' || p === 'secretaire_general_elysee') changerPoste(s, retourSiege(s));
    else if (p === 'depute' || p === 'senateur' || p === 'depute_europeen' || p === 'president_region') changerPoste(s, s.stats.parti >= 50 ? 'secretaire_national' : 'militant');
    else if (p === 'maire') changerPoste(s, 'conseiller_municipal');
    else if (p === 'conseil_constitutionnel') terminer(s, 'demission_cc');
    else if (p === 'prefet' || p === 'ambassadeur' || p === 'commissaire_europeen') changerPoste(s, 'fonctionnaire');
    else if (p === 'fonctionnaire' || p === 'prive' || p === 'lobbyiste' || p === 'think_tank') { /* on garde son emploi */ }
    else changerPoste(s, 'militant');
  }

  function condamner(s) {
    s.flags.condamne = true;
    une(s, 'condamnation');
    decorer(s, 'ineligible');
    terminer(s, 'condamnation');
  }

  function chuteGouvernement(s) {
    une(s, 'chute');
    changerPoste(s, retourSiege(s));
    appliquer(s, { image: -3, parti: -2 });
    return tampon('CENSURÉ|CENSURÉE') + 'La motion est adoptée. Le gouvernement tombe et vous rendez votre maroquin.';
  }

  function candidater(s, type) { s.candidature = type; }

  /** Poste proposé quand votre camp revient au pouvoir. */
  function posteRetour(s) {
    const t = tier(s);
    if (t <= 1) return 'chef_cabinet';
    if (t === 2) return s.stats.parti >= 45 ? 'ministre_delegue' : 'chef_cabinet';
    return (s.stats.parti >= 55 && s.stats.competence >= 50) ? 'ministre' : 'ministre_delegue';
  }

  /** Fonder son propre parti : plus d'appareil à convaincre, plus de filet. */
  function fonderParti(s) {
    s.flags.fondateur = true;
    s.partiNom = pick(DATA.NOMS_PARTIS);
    s.stats.parti = Math.max(s.stats.parti, 82);
    appliquer(s, { image: 4, reseau: -8, medias: 4 });
    s.rival.force = Math.max(0, s.rival.force - 25);
    if (s.poste === 'ministre' || s.poste === 'premier_ministre') { changerPoste(s, retourSiege(s)); }
    decorer(s, 'fondateur');
    une(s, 'parti', {});
    return tampon('FONDATEUR|FONDATRICE', 'bleu') + 'Vous fondez « ' + s.partiNom + ' ». Les investitures sont désormais les vôtres ; les électeurs, il faudra les convaincre seul·e.';
  }

  /* ---------------------------------------------------------------------
     Actions
     --------------------------------------------------------------------- */
  const ONGLETS = ['carriere', 'reseau', 'medias', 'prive'];
  const CAPS = { carriere: 6, reseau: 5, medias: 5, prive: 5 };

  /**
   * Options d'un onglet pour l'année en cours. Les options verrouillées par
   * l'âge ou hors calendrier sont masquées ; les candidatures et transitions
   * verrouillées par une jauge restent visibles (elles indiquent un cap).
   */
  function actionsDisponibles(s, onglet) {
    onglet = onglet || (s.programme && s.programme[s.etape || 0]) || 'carriere';
    const liste = [];
    DATA.ACTIONS.forEach(function (a) {
      if (a.onglet !== onglet) return;
      if (a.postes !== 'tous' && a.postes.indexOf(s.poste) === -1) return;
      const motif = a.req ? a.req(s) : null;
      if (motif) {
        if (a.candidature && motif.indexOf('Pas d') === 0) return;
        if (/jeune|ans requis|encore|d'abord|Personne|Réservé|rien à|Finissez|Déjà|Prenez/.test(motif) && !a.candidature) return;
        if (!a.candidature && !a.transition && !/viser_|senatoriales|regionales|europeennes|fonder_cabinet|think_tank|retraite/.test(a.id)) return;
      }
      if (a.id === 'meetings' && s.communication !== 'orateur') return;
      liste.push({ action: a, motif: motif });
    });
    // Ordre : candidatures et transitions d'abord, puis les autres options
    // mélangées de façon stable pour l'année (variété au fil de la carrière),
    // option neutre et retraite en dernier.
    const graine = function (id) { let h = s.annee * 7919; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0; return h % 1000; };
    const rang = function (x) {
      const a = x.action;
      if (a.candidature) return 0;
      if (a.transition || /^(marche_travail|doctorat|insp|sciencespo|droit|socio|technique)$/.test(a.id)) return 1;
      if (a.id === 'retraite') return 9000;
      if (a.neutre) return 8000;
      return 2000 + graine(a.id);
    };
    liste.sort(function (x, y) { return rang(x) - rang(y); });
    const cap = CAPS[onglet] || 4;
    const dispo = liste.filter(function (x) { return !x.motif; }).slice(0, cap);
    const verrou = liste.filter(function (x) { return x.motif; });
    const reste = Math.max(0, cap - dispo.length);
    // Les candidatures verrouillées restent affichées : elles indiquent le cap à franchir.
    const gardees = verrou.filter(function (x, i) { return i < reste || x.action.candidature; }).slice(0, Math.max(reste, 2));
    return dispo.concat(gardees);
  }

  /** Mandat remis en jeu cette année si le joueur ne se représente pas. */
  function mandatEnJeu(s) {
    const a = s.annee;
    if ((s.poste === 'maire' || s.poste === 'conseiller_municipal') && E_isMunicipales(a) && s.posteDepuis !== a) return 'municipales';
    if (s.poste === 'depute' && E_isLegislatives(a) && s.posteDepuis !== a) return 'législatives';
    if (s.poste === 'senateur' && E_isSenatoriales(a) && a - s.posteDepuis >= 6) return 'sénatoriales';
    if ((s.poste === 'conseiller_regional' || s.poste === 'president_region') && E_isRegionales(a) && s.posteDepuis !== a) return 'régionales';
    if (s.poste === 'depute_europeen' && E_isEuropeennes(a) && s.posteDepuis !== a) return 'européennes';
    return null;
  }

  function choisirAction(s, id) {
    if (s.phase !== 'action') return;
    const a = DATA.ACTIONS.find(function (x) { return x.id === id; });
    if (!a) return;
    if (a.req && a.req(s)) return;

    log(s, 'Action : ' + G(s, typeof a.label === 'function' ? a.label(s) : a.label));
    appliquer(s, a.effets);
    if (a.alea) {
      const ok = hasard() < a.alea.p + (s.personnalite === 'baron_noir' ? 0.1 : 0);
      const issue = ok ? a.alea.bon : a.alea.mauvais;
      appliquer(s, issue.effets);
      log(s, (ok ? '✅ Ça paie. ' : '❌ Ça se retourne contre vous. ') + issue.texte, ok ? 'bon' : 'mauvais', true);
    }
    if (a.candidature) candidater(s, a.candidature);
    if (a.apres) {
      const posteAvant = s.poste;
      const txt = a.apres(s, E);
      const important = s.poste !== posteAvant || /TAMPON/.test(txt || '');
      log(s, txt, important ? 'majeur' : '', important);
    }
    if (a.terminal) { terminer(s, a.terminal); return; }
    if (s.phase === 'fin') return;

    s.dernier[a.onglet] = s.annee;
    s.etape = (s.etape || 0) + 1;
    if (s.etape < s.programme.length) return;      // rubrique suivante

    s.evenement = tirerEvenement(s);
    if (s.evenement) s.phase = 'evenement';
    else finAnnee(s);
  }

  /* ---------------------------------------------------------------------
     Événements
     --------------------------------------------------------------------- */
  function evenementParId(id) {
    return DATA.EVENEMENTS.find(function (e) { return e.id === id; }) || DATA.OFFRES.find(function (e) { return e.id === id; });
  }

  function probaExposition(s) {
    if (s.secret === 'rien' || s.flags.secret_expose || tier(s) < 1) return 0;
    let p = 0.004 + tier(s) * 0.0035 + (s.flags.exposition || 0) * 0.03;
    if (s.personnalite === 'ambitieux') p *= 1.5;
    if (s.personnalite === 'pragmatiste') p *= 0.6;
    if (s.personnalite === 'courtisan') p *= 0.5;
    p *= 1 + s.rival.force / 150;
    p *= 1 - (s.stats.medias - 40) / 250;
    if (s.flags.verrou === s.annee) p *= 0.3;
    else if (s.flags.discret === s.annee) p *= 0.6;
    return clamp(p, 0, 0.6);
  }

  function tirerEvenement(s) {
    // Le secret sort-il ?
    if (hasard() < probaExposition(s)) { une(s, 'secret'); return 'secret_' + s.secret; }

    // Scandale ?
    if (s.casseroles > 0 && s.poste !== 'etudiant') {
      let p = s.casseroles * 0.035 + Math.max(0, 40 - s.stats.integrite) / 400;
      p *= 1 - (s.stats.medias - 40) / 200;
      if (hasard() < p) {
        s.scandales += 1;
        if (s.scandales >= 3) decorer(s, 'casserole_or');
        une(s, 'scandale');
        return (s.casseroles >= 4 && hasard() < 0.4) ? 'mise_en_examen' : 'revelations';
      }
    }

    // Les années sans histoire existent : elles passent vite.
    if (hasard() > (s.poste === 'etudiant' ? 0.45 : 0.72)) return null;
    const candidats = DATA.EVENEMENTS.filter(function (e) {
      return !e.systeme && s.recents.indexOf(e.id) === -1 && (!e.cond || e.cond(s));
    });
    if (!candidats.length) return null;
    let total = 0;
    const poids = candidats.map(function (e) { const w = typeof e.poids === 'function' ? e.poids(s) : (e.poids || 1); total += w; return w; });
    let r = hasard() * total;
    for (let i = 0; i < candidats.length; i++) {
      r -= poids[i];
      if (r <= 0) { s.recents = [candidats[i].id].concat(s.recents).slice(0, 4); return candidats[i].id; }
    }
    return candidats[candidats.length - 1].id;
  }

  function choisirChoix(s, ev, idx) {
    const c = ev.choix[idx];
    if (!c) return false;
    if (c.req && c.req(s)) return false;
    log(s, G(s, ev.titre(s)) + ' — ' + G(s, c.label));
    appliquer(s, c.effets);
    if (c.alea) {
      // Le même choix peut payer ou se retourner contre vous : la conséquence est explicite.
      const ok = hasard() < c.alea.p + (s.personnalite === 'baron_noir' ? 0.1 : 0);
      const issue = ok ? c.alea.bon : c.alea.mauvais;
      appliquer(s, issue.effets);
      log(s, (ok ? '✅ Ça paie. ' : '❌ Ça se retourne contre vous. ') + issue.texte, ok ? 'bon' : 'mauvais', true);
    }
    if (c.apres) {
      const posteAvant = s.poste;
      const txt = c.apres(s, E);
      const important = s.poste !== posteAvant || /TAMPON/.test(txt || '');
      log(s, txt, important ? 'majeur' : '', important);
    }
    return true;
  }

  function choisirEvenement(s, idx) {
    if (s.phase !== 'evenement' || !s.evenement) return;
    const ev = evenementParId(s.evenement);
    if (!choisirChoix(s, ev, idx)) return;
    s.evenement = null;
    if (s.phase === 'fin') return;
    finAnnee(s);
  }

  function choisirOffre(s, idx) {
    if (s.phase !== 'offre' || !s.offre) return;
    const ev = evenementParId(s.offre);
    if (!choisirChoix(s, ev, idx)) return;
    s.offre = null;
    if (s.phase === 'fin') return;
    s.phase = 'bilan';
  }

  /* ---------------------------------------------------------------------
     Climat politique
     --------------------------------------------------------------------- */
  /** Alignement du climat avec un camp : > 0 favorable. */
  function alignement(s, camp) {
    const C = DATA.CAMPS[camp];
    const w = s.climat.vent;
    let a;
    if (C.populiste) a = -0.6 + s.climat.usure * 1.2;
    else if (C.signe === 0) a = 0.45 - Math.abs(w);
    else a = w * C.signe;
    if (camp === s.climat.pouvoir) a -= s.climat.usure * (C.populiste ? 1.6 : 1);
    return a;
  }

  /** Bonus/malus de région et de communication selon l'échelon. */
  function bonusLocal(s) {
    let b = 0;
    if (s.regionDepart === 'rural') b += 0.3;
    if (s.regionDepart === 'paris') b -= 0.2;
    if (s.communication === 'terrain') b += 0.3;
    if (s.personnalite === 'ambitieux') b += 0.15;
    return b;
  }
  function bonusNational(s) {
    let b = 0;
    if (s.regionDepart === 'paris') b += 0.15;
    if (s.regionDepart === 'rural') b -= 0.1;
    if (s.communication === 'orateur') b += 0.2;
    if (s.communication === 'terrain' && !s.flags.diction) b -= 0.15;
    if (s.personnalite === 'ambitieux') b += 0.15;
    if (s.flags.secret_expose && s.personnalite === 'idealiste') b -= 0.3;
    return b;
  }

  function scoreElection(s, x) {
    const p = proba(x);
    const gagne = hasard() < p;
    const marge = gagne ? entre(0.4, 6 + 10 * p) : -entre(0.4, 6 + 10 * (1 - p));
    return { gagne: gagne, pct: 50 + marge };
  }

  /* ---------------------------------------------------------------------
     Élections du joueur
     --------------------------------------------------------------------- */
  function resoudreCandidature(s) {
    const type = s.candidature;
    s.candidature = null;
    if (!type) return;
    const al = alignement(s, s.camp);
    const st = s.stats;
    const rivalMalus = s.rival.force / 250;
    let r;

    switch (type) {
      case 'municipales_liste': {
        const p = 0.7 + st.image / 400 + al * 0.1 + bonusLocal(s) * 0.2;
        if (hasard() < p) {
          if (s.poste !== 'conseiller_municipal') changerPoste(s, 'conseiller_municipal'); else s.posteDepuis = s.annee;
          log(s, tampon('ÉLU|ÉLUE') + 'La liste l\'emporte à ' + s.ville + '. Vous siégez au conseil municipal.', 'majeur', true);
        } else {
          if (s.poste === 'conseiller_municipal') changerPoste(s, 'militant');
          log(s, tampon('BATTU|BATTUE') + 'La liste est battue à ' + s.ville + '. Vous distribuerez des tracts encore un peu.', 'mauvais', true);
        }
        break;
      }
      case 'municipales_tete': {
        const sortant = s.poste === 'maire';
        const x = (st.image - 47) / 15 + al * 1.2 + (st.parti - 30) / 60 + (s.origine === 'agriculteur' ? 0.45 : 0) + (s.origine === 'medecin' ? 0.3 : 0) + bonusLocal(s) + (sortant ? 0.7 : (s.poste === 'conseiller_municipal' ? 0.3 : 0)) - rivalMalus;
        r = scoreElection(s, x);
        if (r.gagne) {
          if (!sortant) changerPoste(s, 'maire'); else s.posteDepuis = s.annee;
          log(s, tampon('ÉLU|ÉLUE') + (sortant ? 'Vous êtes réélu·e maire de ' : 'Vous êtes élu·e maire de ') + s.ville + ' avec ' + pct(r.pct) + ' des voix.', 'majeur', true);
          une(s, 'election_gagnee');
          appliquer(s, { image: 3 });
        } else {
          if (sortant) changerPoste(s, 'conseiller_municipal');
          log(s, tampon('BATTU|BATTUE') + 'Vous perdez la mairie de ' + s.ville + ' avec ' + pct(r.pct) + ' des voix.' + (sortant ? ' Vous siégerez dans l\'opposition.' : ''), 'mauvais', true);
          une(s, 'election_perdue');
          appliquer(s, { image: -3 });
        }
        break;
      }
      case 'regionales_liste': {
        const p = 0.6 + st.parti / 300 + al * 0.2;
        if (hasard() < p) {
          if (s.poste !== 'conseiller_regional') changerPoste(s, 'conseiller_regional'); else s.posteDepuis = s.annee;
          log(s, tampon('ÉLU|ÉLUE') + 'Vous entrez au conseil régional de ' + s.region + '.', 'majeur', true);
        } else {
          if (s.poste === 'conseiller_regional') changerPoste(s, 'militant');
          log(s, tampon('BATTU|BATTUE') + 'La liste régionale échoue. Vous restez sur le quai.', 'mauvais', true);
        }
        break;
      }
      case 'regionales_tete': {
        const sortant = s.poste === 'president_region';
        const x = (st.image - 50) / 14 + al * 1.3 + (st.parti - 35) / 50 + bonusLocal(s) * 0.7 + (sortant ? 0.6 : 0) + (s.mandats.local >= 6 ? 0.3 : 0) - rivalMalus;
        r = scoreElection(s, x);
        if (r.gagne) {
          if (!sortant) changerPoste(s, 'president_region'); else s.posteDepuis = s.annee;
          log(s, tampon('ÉLU|ÉLUE') + 'Vous présidez la région ' + s.region + ' (' + pct(r.pct) + ' au second tour).', 'majeur', true);
          une(s, 'election_gagnee', { lieu: s.region });
          appliquer(s, { image: 3, reseau: 3 });
        } else {
          if (sortant) changerPoste(s, 'conseiller_regional');
          log(s, tampon('BATTU|BATTUE') + 'Vous perdez les régionales avec ' + pct(r.pct) + '.' + (sortant ? ' Vous siégerez dans l\'opposition régionale.' : ''), 'mauvais', true);
          appliquer(s, { image: -3 });
        }
        break;
      }
      case 'legislatives': {
        const pInv = s.flags.fondateur ? 1 : 0.3 + (s.personnalite === 'baron_noir' ? 0.15 : 0) + (st.parti - 40) / 80 + (s.flags.circo_libre ? 0.25 : 0) + (s.origine === 'ministre' ? 0.15 : 0) + (tier(s) >= 2 ? 0.15 : 0) + (s.personnalite === 'ambitieux' ? 0.08 : 0) + (s.personnalite === 'courtisan' ? 0.08 : 0) - rivalMalus;
        if (hasard() > pInv) {
          appliquer(s, { parti: -2 });
          s.rival.force = clamp(s.rival.force + 5, 0, 100);
          log(s, tampon('REFUSÉ|REFUSÉE') + 'La commission d\'investiture préfère ' + s.rival.prenom + ' ' + s.rival.nom + ' pour la ' + s.circo + '. « La prochaine fois, promis. »', 'mauvais', true);
          break;
        }
        log(s, 'Vous obtenez l\'investiture du ' + DATA.CAMPS[s.camp].sigle + ' dans la ' + s.circo + '.');
        const x = (st.image - 45) / 14 + al * 1.4 + (s.mandats.local > 0 || DATA.POSTES[s.poste].local ? 0.5 : 0) + (s.origine === 'agriculteur' ? 0.3 : 0) + (s.origine === 'prof' ? 0.15 : 0) + (s.origine === 'ouvrier' ? 0.3 : 0) + bonusLocal(s) * 0.5 - 0.2 - (s.flags.fondateur && st.image < 70 ? 0.35 : 0);
        r = scoreElection(s, x);
        if (r.gagne) {
          const ancienMaire = s.poste === 'maire';
          if (s.poste === 'lobbyiste') s.flags.lobby = true;
          changerPoste(s, 'depute');
          s.flags.circo_libre = false;
          log(s, tampon('ÉLU|ÉLUE') + 'Vous êtes élu·e député·e de la ' + s.circo + ' avec ' + pct(r.pct) + ' au second tour.' + (ancienMaire ? ' Le non-cumul vous oblige à laisser la mairie à votre premier adjoint.' : ''), 'majeur', true);
          une(s, 'election_gagnee', { lieu: 'la ' + s.circo });
        } else {
          log(s, tampon('BATTU|BATTUE') + 'Vous êtes battu·e aux législatives avec ' + pct(r.pct) + ' au second tour.', 'mauvais', true);
          une(s, 'election_perdue', { lieu: 'la ' + s.circo });
          appliquer(s, { image: -2 });
        }
        break;
      }
      case 'legislatives_reelection': {
        const x = (st.image - 42) / 14 + al * 1.4 + 0.5 + bonusLocal(s) * 0.3;
        r = scoreElection(s, x);
        if (r.gagne) {
          s.posteDepuis = s.annee;
          log(s, tampon('RÉÉLU|RÉÉLUE') + 'Vous conservez votre siège avec ' + pct(r.pct) + '.', 'majeur', true);
          appliquer(s, { image: 2, parti: 2 });
        } else {
          changerPoste(s, st.parti >= 50 ? 'secretaire_national' : 'militant');
          log(s, tampon('BATTU|BATTUE') + 'Vous perdez votre siège avec ' + pct(r.pct) + '. Le Palais-Bourbon se passera de vous.', 'mauvais', true);
          appliquer(s, { image: -4 });
        }
        break;
      }
      case 'dissident': {
        const x = (st.image - 58) / 10 - 0.5 + al * 0.6 + bonusLocal(s) * 0.5;
        r = scoreElection(s, x);
        if (r.gagne) {
          changerPoste(s, 'depute');
          s.flags.dissident = true;
          log(s, tampon('ÉLU|ÉLUE') + 'Contre l\'appareil, vous êtes élu·e député·e avec ' + pct(r.pct) + '. Le parti vous réintègre en grommelant.', 'majeur', true);
          appliquer(s, { parti: 10, image: 4 });
        } else {
          log(s, tampon('BATTU|BATTUE') + 'La dissidence échoue (' + pct(r.pct) + '). Le parti s\'en souviendra longtemps.', 'mauvais', true);
          appliquer(s, { image: -4 });
        }
        break;
      }
      case 'senatoriales': {
        const x = (st.reseau - 52) / 12 + (st.parti - 40) / 25 + (s.mandats.local >= 6 ? 0.6 : 0.1) + al * 0.5 - rivalMalus;
        r = scoreElection(s, x);
        if (r.gagne) {
          changerPoste(s, 'senateur');
          log(s, tampon('ÉLU|ÉLUE') + 'Les grands électeurs vous envoient au Sénat (' + pct(r.pct) + ').', 'majeur', true);
          une(s, 'election_gagnee', { lieu: 'le Sénat' });
        } else {
          log(s, tampon('BATTU|BATTUE') + 'Les grands électeurs vous boudent (' + pct(r.pct) + '). Le Luxembourg attendra.', 'mauvais', true);
        }
        break;
      }
      case 'senatoriales_reelection': {
        const x = (st.reseau - 45) / 12 + (st.parti - 35) / 25 + 0.6 + al * 0.4;
        r = scoreElection(s, x);
        if (r.gagne) {
          s.posteDepuis = s.annee;
          log(s, tampon('RÉÉLU|RÉÉLUE') + 'Les grands électeurs vous renouvellent leur confiance (' + pct(r.pct) + ').', 'majeur', true);
        } else {
          changerPoste(s, st.parti >= 50 ? 'secretaire_national' : 'militant');
          log(s, tampon('BATTU|BATTUE') + 'Vous perdez votre siège de sénateur·rice (' + pct(r.pct) + ').', 'mauvais', true);
        }
        break;
      }
      case 'europeennes': {
        const p = 0.45 + (st.parti - 42) / 120 + al * 0.25 + (s.poste === 'depute_europeen' ? 0.15 : 0) - rivalMalus;
        if (hasard() < p) {
          if (s.poste !== 'depute_europeen') changerPoste(s, 'depute_europeen'); else s.posteDepuis = s.annee;
          log(s, tampon('ÉLU|ÉLUE') + 'Vous êtes en position éligible et la liste passe la barre. Direction Strasbourg.', 'majeur', true);
        } else {
          if (s.poste === 'depute_europeen') changerPoste(s, retourSiege(s));
          log(s, tampon('BATTU|BATTUE') + 'La liste fait un score décevant ; votre place n\'est pas éligible.', 'mauvais', true);
        }
        break;
      }
      case 'presidentielle': {
        const outsider = st.image >= 78 && st.parti < 58 && !s.flags.designe;
        if (!s.flags.designe && !outsider && !s.flags.fondateur && st.parti < 80) {
          const pPrim = 0.3 + (st.parti - 58) / 100 + (st.image - 58) / 150 - rivalMalus + (s.personnalite === 'baron_noir' ? 0.12 : 0);
          if (hasard() > pPrim) {
            appliquer(s, { parti: -5, image: -2 });
            s.rival.force = clamp(s.rival.force + 8, 0, 100);
            log(s, tampon('ÉCARTÉ|ÉCARTÉE') + 'Le parti lui préfère ' + s.rival.prenom + ' ' + s.rival.nom + '. Vous soutenez « sans état d\'âme ».', 'mauvais', true);
            break;
          }
          log(s, 'Le parti vous investit pour la présidentielle.');
        }
        const x = (st.image - 65) / 8 + al * 1.0 + (s.flags.designe ? 0.4 : 0) + (outsider ? -0.3 : 0) - 0.4
          + (tier(s) >= 4 ? 0.3 : 0) - (s.flags.ex_ministre ? 0 : 0.6) - (s.flags.defaites || 0) * 0.5 + (st.competence - 50) / 150
          + bonusNational(s) - (radical(s) ? 1.5 : 0) + (s.flags.normalise ? Math.min(0.5, 0.25 * s.flags.normalise) : 0) - (s.origine === 'prof' ? 0.2 : 0) - (s.origine === 'ouvrier' ? 0.5 : 0) + (st.medias - 40) / 200 - (s.flags.fondateur ? 0.3 : 0);
        r = scoreElection(s, x);
        s.flags.designe = false;
        if (r.gagne) {
          changerPoste(s, 'president');
          s.mandats.presidences = 1;
          s.climat.pouvoir = s.camp;
          s.climat.usure = 0;
          s.flags.eluPresidentCetteAnnee = true;
          if (outsider) decorer(s, 'outsider');
          log(s, tampon('ÉLU|ÉLUE', 'rouge') + 'Vous êtes élu·e Président·e de la République avec ' + pct(r.pct) + ' au second tour. La Marseillaise, les larmes, le perron.', 'majeur', true);
          appliquer(s, { image: 8, parti: 10 });
          une(s, 'presidence');
        } else {
          s.flags.defaites = (s.flags.defaites || 0) + 1;
          log(s, tampon('BATTU|BATTUE') + 'Vous perdez la présidentielle avec ' + pct(r.pct) + ' au second tour. Le discours de défaite est digne. Vous pleurerez dans la voiture.', 'mauvais', true);
          appliquer(s, { image: -10, parti: -8 });
          une(s, 'election_perdue', { lieu: 'la présidentielle' });
        }
        break;
      }
      case 'reelection_presidentielle': {
        const x = (st.image - 50) / 9 - s.climat.usure * 1.5 + 0.3 + bonusNational(s) * 0.5 + ((s.proximite || 50) - 50) / 25;
        r = scoreElection(s, x);
        if (r.gagne) {
          s.mandats.presidences = 2;
          s.posteDepuis = s.annee;
          s.climat.usure = 0.15;
          s.flags.eluPresidentCetteAnnee = true;
          decorer(s, 'reelu');
          log(s, tampon('RÉÉLU|RÉÉLUE') + 'Vous êtes réélu·e avec ' + pct(r.pct) + '. Cinq ans de plus, et déjà l\'usure.', 'majeur', true);
          une(s, 'presidence');
        } else {
          changerPoste(s, 'ancien_president');
          log(s, tampon('BATTU|BATTUE') + 'Le pays vous congédie avec ' + pct(r.pct) + '. Passation de pouvoir sur le perron, sourire crispé.', 'mauvais', true);
        }
        break;
      }
    }
  }

  /** Mandats non défendus : ils tombent. */
  function finsDeMandat(s, cand) {
    const enJeu = mandatEnJeu(s);
    if (!enJeu) return;
    const defendu = {
      'municipales': ['municipales_liste', 'municipales_tete'],
      'législatives': ['legislatives_reelection', 'legislatives'],
      'sénatoriales': ['senatoriales_reelection', 'senatoriales'],
      'régionales': ['regionales_liste', 'regionales_tete'],
      'européennes': ['europeennes']
    }[enJeu];
    if (cand && defendu.indexOf(cand) !== -1) return;
    if (s.posteDepuis === s.annee) return;      // poste obtenu cette année (autre élection)
    const P = DATA.POSTES[s.poste];
    const retour = (s.poste === 'depute' || s.poste === 'senateur' || s.poste === 'depute_europeen') ? retourSiege(s) : (s.stats.parti >= 50 ? 'secretaire_national' : 'militant');
    log(s, 'Vous ne vous êtes pas représenté·e aux ' + enJeu + ' : votre mandat de ' + G(s, P.label).toLowerCase() + ' s\'achève.', 'mauvais', true);
    une(s, 'perdu_mandat');
    s.flags.siege = null;
    changerPoste(s, retour);
  }

  /* ---------------------------------------------------------------------
     Élections nationales (hors joueur) et alternances
     --------------------------------------------------------------------- */
  function resoudreNational(s) {
    const c = s.climat;
    c.vent = clamp(c.vent + entre(-0.18, 0.18), -1, 1);
    c.remaniement = false;

    if (!E_isPresidentielle(s.annee)) {
      c.usure += 0.06;
      if (hasard() < 0.18) c.remaniement = true;
      return;
    }

    c.remaniement = true;
    if (s.flags.eluPresidentCetteAnnee) {
      s.flags.eluPresidentCetteAnnee = false;
      return;                                     // le joueur a gagné : rien d'autre à résoudre
    }

    // Le joueur était Président et n'a pas été réélu / ne s'est pas représenté
    if (s.poste === 'president') {
      changerPoste(s, 'ancien_president');
      log(s, 'Votre quinquennat s\'achève. Vous quittez l\'Élysée.', 'majeur', true);
    }

    const camps = Object.keys(DATA.CAMPS);
    let meilleur = null, meilleurScore = -Infinity;
    camps.forEach(function (k) {
      const sc = alignement(s, k) + entre(-0.45, 0.45) - (DATA.CAMPS[k].populiste ? 0.25 : 0);
      if (sc > meilleurScore) { meilleurScore = sc; meilleur = k; }
    });
    const ancien = c.pouvoir;
    if (meilleur !== ancien) {
      c.pouvoir = meilleur;
      c.usure = 0.05;
      log(s, 'Présidentielle : alternance, ' + DATA.CAMPS[meilleur].label + ' l\'emporte' + (DATA.CAMPS[meilleur].populiste ? '. Séisme politique.' : '.'), meilleur === s.camp ? 'bon' : 'mauvais', true);
      une(s, 'national', { camp: DATA.CAMPS[meilleur].label, bon: meilleur === s.camp });
      if (meilleur === s.camp && !s.flags.fondateur) s.flags.retourCamp = s.annee;   // les postes se distribuent
    } else {
      c.usure += 0.12;
      log(s, 'Présidentielle : le camp sortant (' + DATA.CAMPS[meilleur].label + ') se maintient.', '', true);
    }

    // Conséquences pour un membre du gouvernement ou de l'Élysée
    if (estGouv(s) || s.poste === 'secretaire_general_elysee') {
      if (c.pouvoir !== s.camp) {
        changerPoste(s, retourSiege(s));
        log(s, 'Le nouveau pouvoir forme son gouvernement : vous rendez vos fonctions.', 'mauvais', true);
      } else if (hasard() < 0.45) {
        changerPoste(s, retourSiege(s));
        log(s, 'Remaniement post-électoral : vous n\'êtes pas reconduit·e.', 'mauvais', true);
      } else {
        log(s, 'Vous êtes reconduit·e dans la nouvelle équipe.', 'bon');
      }
    }
  }

  /* ---------------------------------------------------------------------
     Fin d'année
     --------------------------------------------------------------------- */
  function salaire(s) {
    const P = DATA.POSTES[s.poste];
    let brut = P.salaire === null ? 50 + Math.round(s.stats.reseau * 2.2) : P.salaire;
    const vie = 8 + P.tier * 6;
    return { brut: brut, vie: vie, net: brut - vie };
  }

  function erosion(s) {
    if (s.poste === 'etudiant') return;
    let image = 1 + Math.floor(s.stats.image / 35);
    if (s.age >= 68) image += 1;
    if (s.personnalite === 'courtisan') image += 1;
    if (s.communication === 'terrain' && tier(s) >= 3 && !s.flags.diction) image += 1;
    if (s.communication === 'mediatique') image -= 1;
    if (radical(s)) image -= 1;
    if (s.poste === 'president') { s.proximite = clamp((s.proximite === undefined ? 50 : s.proximite) - 2, 0, 100); if (s.proximite < 35) image += 2; }
    appliquer(s, { image: -Math.max(0, image), parti: -1, reseau: s.stats.reseau > 75 ? -2 : (s.stats.reseau > 40 ? -1 : 0), competence: s.stats.competence > 80 ? -2 : (s.stats.competence > 55 ? -1 : 0), medias: s.stats.medias > 20 ? -1 : 0 });
  }

  function finAnnee(s) {
    const cand = s.candidature;
    const P = DATA.POSTES[s.poste];

    erosion(s);
    appliquer(s, P.derive);

    // Revenus
    const sal = salaire(s);
    appliquer(s, { fortune: sal.net });
    log(s, 'Revenus : ' + (sal.brut >= 0 ? '+' + sal.brut : '−' + Math.abs(sal.brut)) + ' k€, train de vie −' + sal.vie + ' k€.');

    // Élections du joueur, puis mandats non défendus
    resoudreCandidature(s);
    if (s.phase === 'fin') return;
    finsDeMandat(s, cand);

    // Climat national
    resoudreNational(s);
    if (s.phase === 'fin') return;

    // Rival·e
    s.rival.force = clamp(s.rival.force + Math.round(entre(1, 3)) + (s.personnalite === 'ambitieux' ? 1 : 0) - (s.flags.rival_ami ? 1 : 0) - (s.personnalite === 'baron_noir' ? 1 : 0), 0, 100);

    // Mandats et postérité
    const Q = DATA.POSTES[s.poste];
    if (Q.local) s.mandats.local += 1;
    if (Q.region) s.mandats.region += 1;
    if (s.poste === 'depute') s.mandats.depute += 1;
    if (s.poste === 'senateur') s.mandats.senateur += 1;
    if (s.poste === 'depute_europeen') s.mandats.europe += 1;
    if (estGouv(s)) s.mandats.gouv += 1;
    if (s.poste === 'conseil_constitutionnel') s.mandats.cc += 1;
    if (Q.tier >= 1 && s.poste !== 'prive') s.anneesPubliques += 1;
    s.posterite += Q.poids;

    // Fins de mandat non électives
    if (s.poste === 'conseil_constitutionnel' && !s.flags.cc_droit && s.annee - s.posteDepuis >= 8) {
      log(s, 'Votre mandat de neuf ans au Conseil constitutionnel s\'achève.', 'majeur', true);
      terminer(s, 'sage');
      return;
    }
    if (s.poste === 'commissaire_europeen' && s.annee - s.posteDepuis >= 5) {
      changerPoste(s, s.stats.parti >= 50 ? 'secretaire_national' : 'militant');
      log(s, 'Votre mandat à la Commission s\'achève. Vous rentrez de Bruxelles avec un excellent réseau et un accent belge.', 'majeur', true);
    }

    // Décorations de parcours
    if (s.fortune >= 1000) decorer(s, 'millionnaire');
    if (s.flags.lobby && s.fortune >= 3000) decorer(s, 'lobby_roi');
    if (s.anneesPubliques >= 40) decorer(s, 'longevite');

    // Offres
    s.offre = tirerOffre(s);
    s.phase = s.offre ? 'offre' : 'bilan';
  }

  function tirerOffre(s) {
    for (let i = 0; i < DATA.OFFRES.length; i++) {
      const o = DATA.OFFRES[i];
      if (!o.cond(s)) continue;
      let w = typeof o.poids === 'function' ? o.poids(s) : o.poids;
      w *= 1 - s.rival.force / 300;
      if (s.personnalite === 'courtisan') w *= 1.5;
      if (s.flags.ministrable === s.annee && (o.id === 'ministre' || o.id === 'ministre_delegue')) w *= 2.5;
      if (s.flags.matignon === s.annee && o.id === 'premier_ministre') w *= 3;
      if (s.flags.matignon === s.annee && o.id === 'premier_ministre' && s.stats.parti >= 75) w = Math.max(w, 0.35);
      if (radical(s) && ['ministre', 'ministre_delegue', 'premier_ministre', 'sg_elysee', 'president_assemblee'].indexOf(o.id) !== -1) w *= 0.5;
      if (hasard() < w) return o.id;
    }
    return null;
  }

  function anneeSuivante(s) {
    if (s.phase !== 'bilan') return;
    s.annee += 1;
    s.age += 1;
    s.deltas = {};
    s.journal = [];
    s.etape = 0;
    s.candidature = null;
    s.evenement = null;
    s.offre = null;

    if (s.poste === 'etudiant' && s.age >= 24) {

  /* ---------------------------------------------------------------------
     Objectif
     --------------------------------------------------------------------- */
  function objectifAtteint(s) {
    switch (s.objectif) {
      case 'presidence': return s.mandats.presidences >= 1;
      case 'ministre': return s.mandats.gouv >= 1 || s.flags.ex_ministre;
      case 'region': return s.mandats.region >= 5 || s.mandats.local >= 12;

      case 'sagesse': return s.mandats.cc >= 1 || s.pic.poste === 'conseil_constitutionnel' || s.decorations.indexOf('berlaymont') !== -1;

    if (s.mandats.presidences >= 2) return { titre: 'Monument de la République', epitaphe: 'Deux quinquennats. Les manuels d\'histoire vous consacreront un chapitre, les humoristes une décennie.' };
    if (pic === 'president') return { titre: g('Chef de l\'État', 'Cheffe de l\'État'), epitaphe: s.origine === 'prof' ? 'De la cité à l\'Élysée. On écrira des livres, on tournera un film, et personne ne croira que c\'est arrivé.' : 'Vous avez habité l\'Élysée. Tout ce qui précède n\'était que le chemin ; tout ce qui suit n\'est que la sortie.' };
    if (pic === 'premier_ministre') return { titre: 'Locataire de Matignon', epitaphe: 'Vous avez tenu le poste le plus ingrat de la République, et vous en êtes ' + g('sorti', 'sortie') + ' debout. À peu près.' };
    if (raison === 'sage' || s.flags.cc_droit || s.mandats.cc > 0) return { titre: 'Sage de la rue de Montpensier', epitaphe: 'Vous avez fini dans la discrétion feutrée du Conseil constitutionnel. Personne ne vous a sifflé depuis des années.' };
    if (pic === 'commissaire_europeen') return { titre: g('Européen de Bruxelles', 'Européenne de Bruxelles'), epitaphe: 'Vous avez présidé aux destinées de la politique de concurrence ou de la pêche. Les Français ne l\'ont jamais su ; les Belges vous saluent.' };
    if (s.flags.lobby && s.fortune >= 1500) return { titre: g('Marchand d\'influence', 'Marchande d\'influence'), epitaphe: 'Vous n\'avez jamais eu de perron ni de Marseillaise, mais vous avez une maison à Ramatuelle et le numéro de tous les ministres.' };
    if (GOUV_POSTES.indexOf(pic) !== -1 || pic === 'president_assemblee' || pic === 'secretaire_general_elysee') return { titre: g('Ancien ministre', 'Ancienne ministre'), epitaphe: 'On vous invite encore sur les plateaux pour commenter la « séquence ». Vous avez un portrait au ministère et une rue promise.' };
    if (pic === 'president_region') return { titre: g('Baron régional', 'Baronne régionale'), epitaphe: 'Vous avez régné sur les lycées et les TER de ' + s.region + '. Paris ne vous a jamais vraiment vu ; ' + s.region + ' ne vous oubliera pas.' };
    if (pic === 'depute' || pic === 'senateur' || pic === 'depute_europeen') return { titre: 'Parlementaire de métier', epitaphe: 'Des amendements, des permanences, des questions au gouvernement. La République tient sur des gens comme vous, et ne les remercie pas.' };
    if (pic === 'prefet' || pic === 'ambassadeur') return { titre: g('Serviteur de l\'État', 'Servante de l\'État'), epitaphe: 'Vous avez représenté la République sans jamais lui demander un vote. C\'est rare, et c\'est reposant.' };
    if (pic === 'maire') return { titre: g('Baron local', 'Baronne locale'), epitaphe: 'À ' + s.ville + ', une salle polyvalente porte votre nom. Ce n\'est pas rien.' };
    if (pic === 'lobbyiste') return { titre: 'Conseil en affaires publiques', epitaphe: 'Vous avez monnayé un carnet d\'adresses de taille modeste. Confortable, oubliable.' };
    if (pic === 'think_tank') return { titre: g('Penseur du dimanche', 'Penseuse du dimanche'), epitaphe: 'Vos notes ont inspiré trois lois et deux discours. Personne ne l\'a su, sauf vous.' };
    if (DATA.POSTES[pic].tier >= 1) return { titre: 'Second couteau|Seconde lame', epitaphe: 'Vous avez servi, conseillé, tracté. Votre nom figure dans des organigrammes que personne ne relit.' };
    return { titre: 'Anonyme de la Ve', epitaphe: 'Vous avez rêvé de la République. Elle ne s\'en est pas aperçue.' };
  }

  function terminer(s, raison) {
    if (s.stats.integrite >= 80 && !s.flags.condamne) decorer(s, 'integre');
    if (s.stats.medias >= 75) decorer(s, 'chouchou');
    if (s.secret !== 'rien' && !s.flags.secret_expose && s.pic.tier >= 3) decorer(s, 'secret_garde');
    const atteint = objectifAtteint(s);
    if (atteint) decorer(s, 'objectif');

    const t = titreFin(s, raison);
    const bonusFortune = Math.min(400, Math.max(0, s.fortune) / 25);
    const bonusDeco = s.decorations.length * 6;
    const bonusImage = s.stats.image >= 50 ? Math.round((s.stats.image - 50) / 2) : 0;
    const malus = s.flags.condamne ? 60 : 0;
    let base = s.posterite + bonusFortune + bonusDeco + bonusImage - malus;

    if (atteint) facteur *= 1.4;

  function electionsDeLAnnee() {
    const l = [];
    if (E_isPresidentielle(s.annee)) l.push('présidentielle');
    if (E_isLegislatives(s.annee)) l.push('législatives');
    if (E_isMunicipales(s.annee)) l.push('municipales');
    if (E_isRegionales(s.annee)) l.push('régionales');
    if (E_isEuropeennes(s.annee)) l.push('européennes');
    if (E_isSenatoriales(s.annee)) l.push('sénatoriales');
    return l;
  }
